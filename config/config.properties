# 配置模版
# [business_type]  名称必须提供且唯一
# 默认配置 指定自定义的flink配置
# flink-conf=../flink-conf.yaml
# 只有sql和table的时候才会需要： 可选
# sql-conf=sql-conf.yaml
# source源类型： kafka/mysql等
# source_from=kafka
# source源对应的配置options
# source.options=../kafka-options.properties
# source源数据处理方式：dataStream/table/sql
# source_op.type=dataStream
# 源类型：bounded(有界) unbounded(无界)
# source_type=unbounded
# sink源类型： kafka/mysql/print等
# sink_to=kafka
# sink对应的配置options
# sink.options=../kakfa-options.properties
# sink源数据处理方式：datastream/table/sql
# sink_op=datastream